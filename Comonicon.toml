# Comonicon CLI configuration. `atlas` is the installed command. deps/build.jl writes the launcher and its
# environment itself (no system image) and uses Comonicon only for the shell completions.
#
# NOTE: Comonicon reads this standalone file (Comonicon.toml / JuliaComonicon.toml),
# NOT a [comonicon] table in Project.toml. Without this file the command name
# falls back to the lowercased module name (`atlasutilities`).
name = "atlas"

[install]
completion = true
quiet = false
