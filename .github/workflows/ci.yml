name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_NUM_THREADS: 2   # exercise the threaded map processing

jobs:
  # One test job per package. 1.11 is the oldest Julia [compat] allows. julia-buildpkg is not used: the only build
  # step is AtlasCLI's, which installs the `mapatlas` command, and the install job below tests that separately.
  library:
    name: AtlasUtilities (Julia ${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.11', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-runtest@v1   # collects coverage (its default)
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: AtlasUtilities
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false   # an upload problem must not fail the tests

  cli:
    name: AtlasCLI (Julia ${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.11', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Install zsh (the tests check that the zsh completion script parses)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: julia-actions/julia-runtest@v1
        with:
          project: AtlasCLI
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: AtlasCLI/src
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: AtlasCLI
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Install the command the two ways the README says and run it: this exercises deps/build.jl (the command's
  # environment and launcher), which the test suites do not.
  install:
    name: install and run `mapatlas` (Julia ${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.11', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Install from this checkout, as from a clone
        run: |
          julia --project=AtlasCLI -e 'import Pkg; Pkg.instantiate()'
          julia --project=AtlasCLI AtlasCLI/deps/build.jl
      - name: Run the installed command
        run: |
          export PATH="$HOME/.julia/bin:$PATH"
          test -x "$HOME/.julia/bin/mapatlas"
          mapatlas --help > /dev/null
          mapatlas info examples/cycleWalk_ct_slice.jsonl.gz
          mapatlas convert examples/cycleWalk_ct_slice.jsonl.gz "$RUNNER_TEMP/ct_v2.jsonl.gz" --to 2
          gzip -dc "$RUNNER_TEMP/ct_v2.jsonl.gz" | sed -n 2p | grep -q '"formatVersion":"2"'
          mapatlas info "$RUNNER_TEMP/ct_v2.jsonl.gz" > /dev/null
          mapatlas list-nodes examples/demo_grid_3x3.jsonl.gz | grep -q '"n0"'
          mapatlas add get_log_spanning_trees examples/cycleWalk_ct_slice.jsonl.gz "$RUNNER_TEMP/added.jsonl.gz" \
            --graph Data/CT_pct20.json --pop-col POP20 --node-col NAME --overwrite --quiet
      # Like the README's `Pkg.add` of both packages from GitHub, but from this checkout, so a pull request installs
      # its own code. Julia 1.13+ is what follows [sources] for StreamHistogram here. Pkg.add runs deps/build.jl only
      # for a newly installed package and only logs a failure, so build again if the launcher is missing.
      - name: Install both packages with Pkg.add
        if: matrix.julia-version == '1'
        run: |
          rm -f "$HOME/.julia/bin/mapatlas"
          julia --project=@mapatlas -e 'import Pkg
              Pkg.add([Pkg.PackageSpec(path = "."), Pkg.PackageSpec(path = ".", subdir = "AtlasCLI")])
              isfile(joinpath(first(DEPOT_PATH), "bin", "mapatlas")) || Pkg.build("AtlasCLI")'
          "$HOME/.julia/bin/mapatlas" info examples/cycleWalk_ct_slice.jsonl.gz > /dev/null
