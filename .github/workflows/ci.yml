name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full test suite, render tests included (CairoMakie draws headless on Linux).
  test:
    name: test (Julia ${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.10 is the oldest Julia [compat] allows.
        julia-version: ['1.10', '1.11', '1']
    env:
      JULIA_NUM_THREADS: 2   # exercise the threaded map processing
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      # Pkg.test only; julia-buildpkg is not used, since the build step installs the `atlas` command, which the
      # install job below tests separately.
      - name: Run tests
        run: julia --project -e 'import Pkg; Pkg.test()'

  # Install the package the way the README says and run the installed `atlas` command: this exercises
  # deps/build.jl (the command's environment and launcher), which the test suite does not.
  install:
    name: install and run `atlas`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # Like the README's `Pkg.add(url=...)`, but from this checkout, so a pull request installs its own code.
      # Pkg.add runs deps/build.jl only for a newly installed package and only logs a failure, so build again when
      # the launcher is missing (e.g. the package came from the cache): Pkg.build fails the step with the error.
      - name: Install AtlasUtilities into a named environment (runs deps/build.jl)
        run: |
          julia --project=@atlas -e 'import Pkg; Pkg.add(path=".")
              isfile(joinpath(first(DEPOT_PATH), "bin", "atlas")) || Pkg.build("AtlasUtilities")'
      - name: Run the installed command
        run: |
          export PATH="$HOME/.julia/bin:$PATH"
          test -x "$HOME/.julia/bin/atlas"
          atlas --help > /dev/null
          atlas info examples/cycleWalk_ct_slice.jsonl.gz
          atlas convert examples/cycleWalk_ct_slice.jsonl.gz "$RUNNER_TEMP/ct_v2.jsonl.gz" --to 2
          gzip -dc "$RUNNER_TEMP/ct_v2.jsonl.gz" | sed -n 2p | grep -q '"formatVersion":"2"'
          atlas info "$RUNNER_TEMP/ct_v2.jsonl.gz" > /dev/null
          atlas list-nodes examples/demo_grid_3x3.jsonl.gz | grep -q '"n0"'
          # render without the plotting packages must stop with the install message, not crash
          if atlas render examples/demo_grid_3x3.jsonl.gz Data/grid_graph_10_by_10.json --key node_name > out.txt 2>&1; then
            echo "render unexpectedly succeeded without the plotting packages"; exit 1
          fi
          grep -q 'atlas install-render' out.txt
